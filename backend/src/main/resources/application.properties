spring.application.name=learnpath-ai
server.port=${PORT:${SERVER_PORT:8080}}

# Supabase (PostgreSQL). Set these as environment variables on your backend host.
# DB_URL example: jdbc:postgresql://aws-0-REGION.pooler.supabase.com:5432/postgres?sslmode=require
# DB_USERNAME example: postgres.YOUR_PROJECT_REF
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Vyshnavi!06}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
server.error.include-message=always
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
